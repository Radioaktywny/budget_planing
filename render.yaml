services:
  # Backend API
  - type: web
    name: budget-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && bash scripts/prepare-render-deploy.sh && npm install && npx prisma generate && npm run build && npx prisma db push --skip-generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: budget-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://budget-planing.vercel.app
      - key: AI_SERVICE_URL
        value: https://budget-ai.onrender.com

  # AI Service
  - type: web
    name: budget-ai
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && python main.py
    envVars:
      - key: PORT
        value: 8001
      - key: LOG_LEVEL
        value: WARNING
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard

databases:
  - name: budget-db
    databaseName: budget_manager
    region: frankfurt
    plan: free
